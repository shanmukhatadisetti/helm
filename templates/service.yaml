apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: 
    component: nginx
    project: roboshop
    env: dev
    purpose: helm-demo
spec:
  type: LoadBalancer
  selector:
    component: nginx
    project: roboshop
    env: dev
    purpose: helm-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80